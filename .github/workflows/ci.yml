name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Linux, Qt 6.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: linux_gcc_64
          modules: qtpositioning qtwebsockets
          cache: true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Tests only: the app itself needs a source-built maplibre-native-qt.
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DTRAINSONMAP_BUILD_APP=OFF

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
